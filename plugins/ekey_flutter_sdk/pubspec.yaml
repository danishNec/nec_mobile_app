name: ekey_flutter_sdk
description: "eKey 2.0 app-to-app login for Flutter (Android + iOS). Wraps the native EkeySDK."
version: 1.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.nec.ekey_flutter_sdk
        pluginClass: EkeyFlutterSdkPlugin
      ios:
        pluginClass: EkeyFlutterSdkPlugin
