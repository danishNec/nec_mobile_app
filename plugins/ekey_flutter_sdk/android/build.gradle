group = "com.nec.ekey_flutter_sdk"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.nec.ekey_flutter_sdk"
    compileSdk = 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // Bundled native eKey SDK. Shipped as a plain .jar (extracted from the original
        // EkeySDK.aar — which carried no resources/JNI) because Android Gradle rejects
        // direct local .aar dependencies inside a library module. EkeyLoginActivity and the
        // necekey://callback intent-filter are re-declared in this module's AndroidManifest.
        implementation files("libs/EkeySDK.jar")

        // Runtime dependencies the bundled EkeySDK.aar needs (its login screen is
        // Jetpack Compose based). The plugin itself compiles no Compose code.
        implementation platform("androidx.compose:compose-bom:2024.09.00")
        implementation "androidx.activity:activity-compose:1.9.2"
        implementation "androidx.compose.material3:material3"
        implementation "androidx.compose.ui:ui"
        implementation "androidx.compose.ui:ui-graphics"
        implementation "androidx.core:core-ktx:1.13.1"
        implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    }
}
